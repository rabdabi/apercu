# Emil — reusable action vocabulary (Moho Actions)
#
# The library of reusable movements the animator/skill builds ONCE into the
# master rig as Moho Actions, then reuses per scene. Names are stable; each
# maps to a real Moho Action name only after the master rig exists.
#
# Timing must obey content-bible/world/motion-language.md: animate on 2s, hold
# key drawings 2-4 frames, stillness is a valid state. No smooth 60fps easing.

character_id: CHAR-EMIL-001
status: TODO-no-rig-yet
fps: 24
feel: animate-on-2s

actions:
  # idle family
  idle:           { moho_action: null, note: "breathe + occasional blink; mostly still" }
  idle_nervous:   { moho_action: null }
  idle_cold:      { moho_action: null }

  # locomotion
  walk:           { moho_action: null, note: "on 2s; built from walk_* poses in poses.yaml" }
  walk_slow:      { moho_action: null }
  walk_tired:     { moho_action: null }
  walk_hurried:   { moho_action: null }

  # looks
  look_left:      { moho_action: null }
  look_right:     { moho_action: null }
  look_up:        { moho_action: null }
  look_down:      { moho_action: null }

  # gestures
  point_left:     { moho_action: null }
  point_right:    { moho_action: null }
  sit:            { moho_action: null }
  stand:          { moho_action: null }
  carry_light:    { moho_action: null }
  carry_heavy:    { moho_action: null }
  eat:            { moho_action: null }
  drink:          { moho_action: null }

  # reactions (land hard because they are rare; brows lead)
  react_surprised:    { moho_action: null }
  react_angry:        { moho_action: null }
  react_afraid:       { moho_action: null }
  react_disappointed: { moho_action: null }
