# Emil — canonical pose library (planning names)
#
# These pose names are the shared vocabulary between scene planning
# (episodes/<slug>/moho-scenes.json) and the Moho rig. They deliberately
# align with the model-sheet poses and Rive states already fixed in
# content-bible/characters/emil.md — do not invent a parallel vocabulary.
#
# `moho_action` is null until the master rig exists; the skill rediscovers
# and fills these against the real rig, never from memory.

character_id: CHAR-EMIL-001
status: TODO-no-rig-yet

# --- Base orientations (from emil.md model sheet: front/side/3q/back) ---
poses:
  neutral_front:   { moho_action: null, note: "on-model rest, facing camera" }
  neutral_3q:      { moho_action: null, note: "three-quarter, default staging angle" }
  neutral_side:    { moho_action: null, note: "profile; walk cycles build from here" }
  neutral_back:    { moho_action: null, note: "back view" }

  # --- Walk contacts/passing (side), both directions ---
  walk_contact_left:  { moho_action: null }
  walk_down_left:     { moho_action: null }
  walk_passing_left:  { moho_action: null }
  walk_up_left:       { moho_action: null }
  walk_contact_right: { moho_action: null }

  # --- Held acting poses ---
  point:        { moho_action: null, note: "arm extended; hand switch = point" }
  carry:        { moho_action: null, note: "both hands; hand switch = carry" }
  sit:          { moho_action: null }
  eat:          { moho_action: null }
  look_up:      { moho_action: null, note: "dwarfed-by-architecture beat" }
  look_down:    { moho_action: null }

  # --- Expression extremes (brows/eyes do the acting; 12 canon expressions) ---
  fear:         { moho_action: null }
  anger:        { moho_action: null }
  sad:          { moho_action: null }
  exhausted:    { moho_action: null }
