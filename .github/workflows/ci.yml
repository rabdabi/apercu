name: CI

on:
  push:
    branches: [main]
  pull_request:

# No deployment, no secrets — safe checks only.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type & content checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://apercu.tech
          NODE_ENV: production
